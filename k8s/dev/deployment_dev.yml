apiVersion: apps/v1
kind: Deployment
metadata:
  name: unilever-app-dev
  namespace: unilever-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: unilever-app-dev
  template:
    metadata:
      labels:
        app: unilever-app-dev
    spec:
      containers:
      - name: unilever-app-dev
        image: moreshital16/unilever-app:v1
        ports:
        - containerPort: 5000
